<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On The Cloud's Projects</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 10px;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0051cb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to On The Cloud's Projects!</h1>
        <a href="https://www.youtube.com/@Onthecloud-l4i" target="_blank" rel="noopener noreferrer"><button>Link to my channel</button></a>
    </div>

    <div class="container">
            <span>Sub count: <span id="subCount">Loading...</span></span>
    </div>

    <div class="container">
        <div class="g-ytsubscribe" 
         data-channel="Onthecloud-l4i" 
         data-layout="default" 
         data-count="default">
        </div>
    </div>

    <script>
        // Points directly to your custom Flask Scraper API path on Vercel
        const proxyApiUrl = "/api/get-subs";

        function getLiveCount() {
            fetch(proxyApiUrl)
                .then(res => res.json())
                .then(data => {
                    // Pulls the text string served straight from your Flask file
                    document.getElementById('subCount').innerText = data.subscribers;
                })
                .catch(err => {
                    console.error("Could not reach Flask Scraper API", err);
                    document.getElementById('subCount').innerText = "Offline";
                });
        }

        // Trigger the scraper when the user loads into the page
        window.onload = getLiveCount;
    </script>
</body>
</html>
